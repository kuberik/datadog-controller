apiVersion: datadoghq.com/v1alpha1
kind: DatadogMonitor
metadata:
  name: datadogmonitor-sample
  namespace: default
  annotations:
    kuberik.com/health-check: "true"
    # kuberik.com/datadog-gate-identifier: "canary"
    # kuberik.com/datadog-gate-version: "1.2.3"
    # kuberik.com/datadog-gate-apm-primary-tag: "team:platform"
spec:
  name: "Sample Monitor"
  type: "metric alert"
  query: "avg(last_5m):avg:system.cpu.user{*} > 80"
  message: "CPU usage is high"
  tags:
    - "env:production"
    - "service:datadog-controller"
