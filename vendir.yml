apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: vendir/crds
    contents:
      - path: datadog
        git:
          url: https://github.com/DataDog/datadog-operator
          ref: v1.8.0
          subPath: config/crd/bases
        newRootPath: .
      # DEV-ONLY: unreleased status.observations CRD; swap back to the git ref of the released rollout-controller.
      - path: kuberik
        directory:
          path: ../../.worktrees/rollout-controller-observations/config/crd/bases
