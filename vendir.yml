apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: vendir/crds
    contents:
      - path: datadog
        git:
          url: https://github.com/DataDog/datadog-operator
          ref: v1.8.0
          subPath: config/crd/bases
        newRootPath: .
      # Pins the unreleased status.observations CRD (rollout-controller #56);
      # move to the release tag once it ships.
      - path: kuberik
        git:
          url: https://github.com/kuberik/rollout-controller
          ref: 3023a85b155bea1d841ee308f4018841ce58ea20
          subPath: config/crd/bases
        newRootPath: .
